name: Build Windows app

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: WISC-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
      - name: Publish release with direct download links
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" dist/WISC-Setup-*.exe dist/WISC-Portable-*.exe \
            --target "$GITHUB_SHA" \
            --title "WISC-IV HEB ${VERSION} — Windows" \
            --notes "WISC-Setup = ملف التثبيت (أيقونة على سطح المكتب). WISC-Portable = يشتغل مباشرة بدون تثبيت."
